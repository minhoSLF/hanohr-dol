<style>
  :root{
    --paper:#F6F3ED;
    --card:#FCFAF6;
    --ink:#20201D;
    --ink-soft:#4A4740;
    --muted:#8C877C;
    --rule:#D9D3C7;
    --accent:#1F1E1B;
    --shadow:rgba(60,54,42,.16);
    --serif:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
    --display:"Cormorant Garamond","Gowun Batang",Georgia,serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    padding-inline:16px;
    padding-block:28px 44px;
    display:flex;
    justify-content:center;
  }
  .card{
    width:100%;
    max-width:430px;
    background:var(--card);
    border:1px solid var(--rule);
    box-shadow:0 18px 46px -22px var(--shadow);
    padding:38px 26px 30px;
    display:flex;
    flex-direction:column;
    gap:26px;
    position:relative;
  }
  .card::after{
    content:"";
    position:absolute;
    inset:9px;
    border:1px solid rgba(217,211,199,.75);
    pointer-events:none;
  }

  /* ── header ───────────────────────────── */
  header{text-align:center;display:flex;flex-direction:column;gap:12px}
  .sprig{display:block;margin:0 auto;width:34px;height:auto;opacity:.75}
  .title{
    font-family:var(--display);
    font-weight:500;
    font-size:clamp(25px,7.4vw,31px);
    letter-spacing:.1em;
    text-transform:uppercase;
    margin:0;
    line-height:1.15;
    text-wrap:balance;
  }
  .title .one{
    font-size:1.5em;
    font-weight:500;
    letter-spacing:.02em;
    line-height:0;
  }
  .title .ord{
    font-size:.62em;
    text-transform:lowercase;
    letter-spacing:.02em;
    vertical-align:.52em;
    margin-right:.16em;
  }
  .kicker{
    font-family:var(--display);
    font-size:12px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }

  /* ── photo ────────────────────────────── */
  figure{margin:0}
  .photo{
    width:100%;
    max-width:100%;
    aspect-ratio:3/4;
    border-radius:50% 50% 8px 8px / 32% 32% 3% 3%;
    overflow:hidden;
    background:#E7E2D9;
  }
  .photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:52% 42%;
    display:block;
  }

  /* ── message ──────────────────────────── */
  .message{
    margin:0;
    text-align:center;
    font-size:15px;
    line-height:2;
    color:var(--ink-soft);
    word-break:keep-all;
  }
  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--rule);
  }
  .divider::before,.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--rule);
  }
  .divider span{
    font-size:9px;
    letter-spacing:.3em;
    color:var(--muted);
  }

  /* ── details ──────────────────────────── */
  dl{
    margin:0;
    display:grid;
    grid-template-columns:auto 1fr;
    gap:14px 16px;
    align-items:baseline;
  }
  dt{
    font-family:var(--display);
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }
  dd{
    margin:0;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    word-break:keep-all;
  }
  dd small{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-top:3px;
  }
  .dday{
    text-align:center;
    font-family:var(--display);
    font-size:13px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .dday strong{color:var(--ink);font-weight:600}

  /* ── actions ──────────────────────────── */
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    flex:1 1 120px;
    appearance:none;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:var(--serif);
    font-size:13.5px;
    letter-spacing:.02em;
    padding:12px 10px;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
    transition:background .18s ease,color .18s ease;
  }
  .btn:hover,.btn:focus-visible{background:var(--ink);color:var(--card)}
  .btn:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
  .toast{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    min-height:1.2em;
  }

  /* ── family ───────────────────────────── */
  .family{
    text-align:center;
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.9;
    margin:0;
  }
  .family em{font-style:normal;color:var(--muted);font-size:12px;letter-spacing:.06em}
  .heart{color:#8C8574;font-size:11px;vertical-align:1px;margin:0 5px}
  .closing{
    text-align:center;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

        navigator.clipboard.writeText(addr).then(function () { done(true); }, function () { done(false); });
      } else { done(false); }
    });
  })();
</script>

</body>
</html>
